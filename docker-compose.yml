name: sm-automation

# Shared settings for the app containers (worker + dashboard).
x-app-env: &app-env
  APP_URL: ${APP_URL:-http://localhost:3000}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Gemini (optional: AI features stay hidden when the key is missing).
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  AI_MODEL_FAST: ${AI_MODEL_FAST:-gemini-3.5-flash-lite}
  AI_MODEL_DEFAULT: ${AI_MODEL_DEFAULT:-gemini-3.8-flash}
  AI_MODEL_PREMIUM: ${AI_MODEL_PREMIUM:-gemini-3.1-pro-preview}
  AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-gemini-embedding-2}
  # Telegram bot.
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  ADMIN_TELEGRAM_CHAT_ID: ${ADMIN_TELEGRAM_CHAT_ID:-}
  # Object storage.
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
  # Meta / Google / Buffer apps.
  META_DIRECT_ENABLED: ${META_DIRECT_ENABLED:-false}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
  META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v26.0}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  BUFFER_CLIENT_ID: ${BUFFER_CLIENT_ID:-}
  BUFFER_CLIENT_SECRET: ${BUFFER_CLIENT_SECRET:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${APP_DB_NAME:-smapp}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/sql:/app-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${APP_DB_NAME:-smapp}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: applies db/migrations, then exits. Both apps wait for it to succeed.
  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: sm-automation-worker
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${APP_DB_NAME:-smapp}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: ["node", "dist/migrate.js"]

  # One-shot: creates/rotates unprivileged runtime logins after role groups exist.
  provision:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME:-smapp}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      OPERATOR_DB_USER: ${OPERATOR_DB_USER}
      OPERATOR_DB_PASSWORD: ${OPERATOR_DB_PASSWORD}
      WORKER_DB_USER: ${WORKER_DB_USER}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD}
    volumes:
      - ./db/sql:/app-sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        psql -h postgres -U "$$POSTGRES_USER" -d "$$APP_DB_NAME" \
          -f /app-sql/provision_runtime_roles.sql

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: sm-automation-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      provision:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      DATABASE_URL: postgres://${WORKER_DB_USER}:${WORKER_DB_PASSWORD}@postgres:5432/${APP_DB_NAME:-smapp}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      provision:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${APP_DB_NAME:-smapp}
      OPERATOR_DATABASE_URL: postgres://${OPERATOR_DB_USER}:${OPERATOR_DB_PASSWORD}@postgres:5432/${APP_DB_NAME:-smapp}
      SESSION_SECRET: ${SESSION_SECRET}
      SIGNUP_CODE: ${SIGNUP_CODE:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - dashboard
    ports:
      - "80:80"
      - "443:443"
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg_data:
  caddy_data:
  caddy_config:
